<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Potato Unboxed</title>
  <meta name="description" content="Potato Unboxed – finds website, spreadsheet, Discord, LitBuy coupons and Telegram. All links in one place.">
  <meta name="theme-color" content="#050506">
  <meta property="og:title" content="Potato Unboxed">
  <meta property="og:description" content="All my links: finds website, spreadsheet, Discord, LitBuy & Telegram.">
  <meta property="og:image" content="assets/og.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050506; --text: #f5f2f4; --muted: #9a949c; --line: rgba(255,255,255,.1);
      --pink: #f472b6; --pink2: #ec4899; --sakura: #ffc4dd; --teal: #2dd4bf; --violet: #a78bfa;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: clip; }
    body {
      background: var(--bg); color: var(--text); overflow-x: hidden;
      font: 15px/1.5 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    svg { width: 22px; height: 22px; flex: none; }

    /* Hintergrund: Nebel, Berg-Silhouette, Kirschblüten */
    .sky { position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(520px 380px at 50% -8%, rgba(236,72,153,.30), transparent 70%),
        radial-gradient(420px 320px at -10% 70%, rgba(167,139,250,.12), transparent 70%),
        radial-gradient(420px 320px at 110% 85%, rgba(45,212,191,.09), transparent 70%); }
    .moon { position: fixed; top: 9vh; left: 50%; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; z-index: -2;
      border: 1px solid rgba(255,196,221,.12); box-shadow: 0 0 120px rgba(236,72,153,.12) inset; pointer-events: none; }
    .mountain { position: fixed; left: 0; right: 0; bottom: 0; height: 32vh; z-index: -1; pointer-events: none; opacity: .5; }
    .petals { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .petal { position: absolute; top: -30px; pointer-events: none; width: 12px; height: 10px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--sakura) 60%, #f9a8d4);
      border-radius: 80% 0 80% 0; opacity: .8; animation: fall linear infinite; }
    @keyframes fall {
      0% { transform: translate3d(0,-5vh,0) rotate(0deg); }
      100% { transform: translate3d(var(--drift), 110vh, 0) rotate(720deg); }
    }

    main { width: 100%; max-width: 500px; margin: 0 auto; padding: 56px 16px 40px; text-align: center; }

    .avatar { position: relative; width: 132px; height: 132px; margin: 0 auto 22px; }
    .avatar::before { content: ""; position: absolute; inset: -5px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--pink), var(--teal), var(--violet), var(--pink));
      animation: spin 6s linear infinite; filter: blur(.3px); }
    .avatar::after { content: ""; position: absolute; inset: -22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,.35), transparent 65%); z-index: -1; }
    .avatar img { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 4px solid var(--bg); background: #000; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .verified { position: absolute; right: 4px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink2), var(--violet)); border: 3px solid var(--bg);
      display: grid; place-items: center; color: #fff; }
    .verified svg { width: 15px; height: 15px; }

    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 34px;
      letter-spacing: .28em; margin: 0 0 4px; padding-left: .28em; line-height: 1.15; }
    .handle { color: var(--pink); font-weight: 600; font-size: 14px; letter-spacing: .04em; margin-bottom: 12px; }
    .bio { color: var(--muted); margin: 0 auto 26px; max-width: 360px; }

    .links { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .link { position: relative; display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-radius: 18px; text-align: left;
      background: rgba(18,18,21,.78); border: 1px solid var(--line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
      opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .link:hover, .link:focus-visible { transform: translateY(-3px) scale(1.01); border-color: rgba(244,114,182,.6);
      box-shadow: 0 14px 40px rgba(236,72,153,.22); outline: none; }
    .link:active { transform: scale(.98); }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; }
    .txt { flex: 1; min-width: 0; }
    .txt b { display: block; font-size: 16px; font-weight: 650; }
    .txt > span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arrow { color: #5d5862; transition: transform .25s, color .25s; }
    .link:hover .arrow { transform: translateX(3px); color: var(--sakura); }

    /* erster Link: hervorgehoben mit wanderndem Farbrand */
    .link.hero { padding: 18px 16px; border: 0; background: rgba(20,10,16,.9); }
    .link.hero::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1;
      background: linear-gradient(var(--a, 0deg), var(--pink), var(--teal), var(--violet), var(--pink));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; animation: border 4s linear infinite; }
    @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    @keyframes border { to { --a: 360deg; } }
    .link.hero .ic { width: 56px; height: 56px; overflow: hidden; padding: 0; background: #000; }
    .link.hero .ic img { width: 100%; height: 100%; object-fit: cover; }
    .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
      vertical-align: 2px; background: linear-gradient(135deg, var(--pink2), var(--violet)); color: #fff; }

    .socials { display: flex; justify-content: center; gap: 12px; margin: 28px 0 0; }
    .socials a { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
      border: 1px solid var(--line); background: rgba(18,18,21,.7); transition: .25s; }
    .socials a:hover { border-color: rgba(244,114,182,.6); transform: translateY(-2px); color: var(--sakura); }
    .socials svg { width: 20px; height: 20px; }

    .share { margin-top: 26px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(18,18,21,.7); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; transition: .25s; }
    .share:hover { color: var(--text); border-color: rgba(255,255,255,.3); }
    .share svg { width: 15px; height: 15px; }
    footer { margin-top: 34px; color: #5d5862; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px;
      background: #fff; color: #111; font-weight: 600; font-size: 14px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .link { opacity: 1; }
      .petal { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <svg class="mountain" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1420"/><stop offset="1" stop-color="#050506"/></linearGradient></defs>
    <path fill="url(#m)" d="M0 320 L0 250 L180 200 L330 235 L520 150 L640 70 L720 40 L800 75 L920 150 L1100 210 L1260 185 L1440 230 L1440 320 Z"/>
    <path fill="#e9d5df" opacity=".18" d="M640 70 L720 40 L800 75 L770 80 L745 70 L720 85 L695 72 L668 82 Z"/>
  </svg>

  <main>
    <div class="avatar">
      <img src="assets/logo.png" alt="Potato Unboxed logo" width="132" height="132">
      <span class="verified" title="Verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </div>
    <h1>POTATO UNBOXED</h1>
    <div class="handle">@potato_unboxed</div>
    <p class="bio" id="bio">Best finds, QC checks &amp; coupons – everything in one place.</p>

    <nav class="links" id="links" aria-label="Links"></nav>

    <div class="socials" id="socials"></div>
    <button class="share" id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>Share</button>
    <footer>Potato Unboxed · <span id="year"></span></footer>
  </main>

  <script>
    /* ===== Deine Links – hier einfach ändern ===== */
    const LINKS = [
      { title: "Finds Website", sub: "3600+ finds · QC photos · ratings", url: "finds/", hero: true, tag: "NEW" },
      { title: "Spreadsheet", sub: "The original Potatoreps sheet", url: "https://docs.google.com/spreadsheets/d/1In27Tyf9DnuvnpmoZM942dRA1M5vbkVGOSgnw2mo2V8/edit?usp=sharing", icon: "sheet", color: "linear-gradient(135deg,#16a34a,#15803d)" },
      { title: "Discord", sub: "QC checks, new finds & help", url: "https://discord.gg/gvsSjAGjpZ", icon: "discord", color: "#5865f2" },
      { title: "LitBuy – $320 coupons", sub: "Register with my link & save on your haul", url: "https://litbuy.com/register?inviteCode=HTER1BHTX", icon: "gift", color: "linear-gradient(135deg,#ec4899,#a855f7)" },
      { title: "Telegram", sub: "Drops & updates first", url: "https://t.me/boonbuys", icon: "telegram", color: "#229ed9" }
    ];
    const SOCIALS = [
      { name: "TikTok", url: "https://www.tiktok.com/@max_outfit_index", icon: "tiktok" },
      { name: "Discord", url: "https://discord.gg/gvsSjAGjpZ", icon: "discord" },
      { name: "Telegram", url: "https://t.me/boonbuys", icon: "telegram" }
    ];
    /* ============================================ */

    const ICONS = {
      sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
      discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 4.37A19.8 19.8 0 0 0 15.43 2.8c-.21.38-.44.87-.61 1.25a18.3 18.3 0 0 0-5.49 0 12.6 12.6 0 0 0-.62-1.25 19.7 19.7 0 0 0-4.89 1.52C.53 9.05-.32 13.58.1 18.06a19.9 19.9 0 0 0 6 3.03c.46-.63.87-1.3 1.23-1.99-.67-.25-1.3-.55-1.9-.9l.38-.3c3.93 1.8 8.18 1.8 12.07 0l.37.3c-.6.35-1.23.65-1.88.9.36.7.77 1.36 1.22 1.99a19.8 19.8 0 0 0 6-3.03c.5-5.18-.84-9.67-3.55-13.69ZM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42s.96-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.15-1.09-2.15-2.42s.95-2.42 2.15-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.33-.95 2.42-2.16 2.42Z"/></svg>',
      gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>',
      telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.3 18.7 19.6c-.24 1.07-.88 1.34-1.78.83l-4.93-3.63-2.38 2.29c-.26.26-.48.48-.99.48l.35-5.02 9.13-8.25c.4-.35-.09-.55-.62-.2L6.2 13.2l-4.86-1.52c-1.06-.33-1.08-1.06.22-1.57L20.55 2.8c.88-.33 1.65.2 1.39 1.5Z"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2V2h-3.4v13.4a2.9 2.9 0 1 1-2-2.7V9.2a6.3 6.3 0 1 0 5.4 6.2V8.6a8.2 8.2 0 0 0 4.8 1.5V6.7h-1Z"/></svg>'
    };
    const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    document.getElementById("links").innerHTML = LINKS.filter(l => l.url).map((l, i) => {
      const ext = /^https?:/.test(l.url);
      const ic = l.hero ? '<span class="ic"><img src="assets/logo.png" alt=""></span>' : `<span class="ic" style="background:${l.color}">${ICONS[l.icon] || ""}</span>`;
      return `<a class="link${l.hero ? " hero" : ""}" href="${esc(l.url)}" ${ext ? 'target="_blank" rel="noopener"' : ""} style="animation-delay:${120 + i * 90}ms">
        ${ic}<span class="txt"><b>${esc(l.title)}${l.tag ? `<span class="tag">${esc(l.tag)}</span>` : ""}</b><span>${esc(l.sub)}</span></span>${ARROW}</a>`;
    }).join("");
    document.getElementById("socials").innerHTML = SOCIALS.map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.name)}" title="${esc(s.name)}">${ICONS[s.icon]}</a>`).join("");
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("share").addEventListener("click", async () => {
      const data = { title: "Potato Unboxed", url: location.href };
      try {
        if (navigator.share) await navigator.share(data);
        else { await navigator.clipboard.writeText(location.href); toast("Link copied!"); }
      } catch { /* abgebrochen */ }
    });
    function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 1800); }

    // Kirschblüten
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      for (let i = 0; i < 22; i++) {
        const p = document.createElement("div"); p.className = "petal";
        const s = 6 + Math.random() * 9;
        p.style.cssText = `left:${Math.random() * 100}vw;width:${s}px;height:${s * .8}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s;--drift:${(Math.random() - .3) * 30}vw;opacity:${.35 + Math.random() * .5}`;
        document.getElementById("petals").append(p);
      }
    }
  </script>
</body>
</html>
